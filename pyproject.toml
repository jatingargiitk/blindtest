[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blindtest"
version = "0.1.0"
description = "Have an agent write tests from the spec only, seal them, then grade them against known-buggy and fixed revisions."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jatin Garg" }]
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
blindtest = "blindtest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
